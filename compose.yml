services:
  zenproxy:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: zenproxy
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: "${RUST_LOG:-zenproxy=info,tower_http=info}"
      ZENPROXY_DATABASE_URL: "postgresql://${POSTGRES_USER:-zenproxy}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-zenproxy}"
      ZENPROXY_ADMIN_PASSWORD: "${ZENPROXY_ADMIN_PASSWORD:-change-me}"
      ZENPROXY_SUBSCRIPTION_PASSWORD: "${ZENPROXY_SUBSCRIPTION_PASSWORD:-change-subscription-password}"
      ZENPROXY_OAUTH_CLIENT_ID: "${ZENPROXY_OAUTH_CLIENT_ID:-}"
      ZENPROXY_OAUTH_CLIENT_SECRET: "${ZENPROXY_OAUTH_CLIENT_SECRET:-}"
      ZENPROXY_OAUTH_REDIRECT_URI: "${ZENPROXY_OAUTH_REDIRECT_URI:-http://localhost/api/auth/callback}"
      ZENPROXY_OAUTH_REQUIRED_GUILD_ID: "${ZENPROXY_OAUTH_REQUIRED_GUILD_ID:-}"
      ZENPROXY_PROXY_LISTENER: "${ZENPROXY_PROXY_LISTENER:-}"
      ZENPROXY_PROXY_AUTH_MODE: "${ZENPROXY_PROXY_AUTH_MODE:-static}"
      ZENPROXY_PROXY_CREDENTIAL_SECRET: "${ZENPROXY_PROXY_CREDENTIAL_SECRET:-}"
      ZENPROXY_PUBLIC_PROXY_HOST: "${ZENPROXY_PUBLIC_PROXY_HOST:-}"
      ZENPROXY_PUBLIC_PROXY_PORT: "${ZENPROXY_PUBLIC_PROXY_PORT:-0}"
    ports:
      # 只允许宿主机上的 Nginx 访问，不向公网直接暴露 ZenProxy。
      - "127.0.0.1:${ZENPROXY_HOST_PORT:?请在 .env 中设置 ZENPROXY_HOST_PORT}:3000"
      # 对外提供带账号密码认证的 SOCKS5 + HTTP 混合代理入口。
      # 容器内监听端口固定为 1080，宿主机端口通过 .env 单独配置。
      - "${ZENPROXY_PROXY_BIND_IP:-0.0.0.0}:${ZENPROXY_PROXY_PORT:?请在 .env 中设置 ZENPROXY_PROXY_PORT}:1080"
    volumes:
      - zenproxy_data:/app/data
    networks:
      - backend
      - egress

  postgres:
    image: postgres:16-alpine
    container_name: zenproxy-postgres
    restart: unless-stopped
    shm_size: "1gb"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=on
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenproxy}
      POSTGRES_USER: ${POSTGRES_USER:-zenproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenproxy} -d ${POSTGRES_DB:-zenproxy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres_data:
  zenproxy_data:
