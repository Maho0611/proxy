[package]
name = "zenproxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
arc-swap = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "socks", "rustls-tls", "stream"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5"
futures-util = "0.3"
pin-project-lite = "0.2"
percent-encoding = "2"
scraper = "0.19"
pulldown-cmark = "0.13.1"
sysinfo = "0.30"
